    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { css, cx } = emotion;

        // Dynamic Glassmorphism Card Style
        const getGlassCardStyle = (isDark) => css`

        const gradientBtnStyle = css`
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: 200% 200%;

        const pulseGlowStyle = css`

                0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }

        const ASPECT_RATIOS = {
            '9:16': { label: '📱 9:16 (쇼츠/릴스/틱톡)', width: 1080, height: 1920, aspectClass: 'aspect-[9/16]' },
            '16:9': { label: '🖥️ 16:9 (유튜브 일반)', width: 1920, height: 1080, aspectClass: 'aspect-[16/9]' },
            '1:1': { label: '🟦 1:1 (정사각형 피드)', width: 1080, height: 1080, aspectClass: 'aspect-square' }
        };

        const getMotionEffects = (w, h) => [
            { id: 'zoomIn', name: '🔍 Zoom In (피사체 확대)', ffmpeg: `zoompan=z='min(zoom+0.0015,1.25)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=120:s=${w}x${h}:fps=30` },
            { id: 'zoomOut', name: '🔎 Zoom Out (피사체 축소)', ffmpeg: `zoompan=z='max(1.25-zoom*0.0015,1.0)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=120:s=${w}x${h}:fps=30` },
            { id: 'panLeft', name: '⬅️ Pan Left (좌측 모션)', ffmpeg: `zoompan=z='1.18':x='if(lte(on,1),iw*0.1,x-1.5)':y='ih/2-(ih/zoom/2)':d=120:s=${w}x${h}:fps=30` },
            { id: 'panRight', name: '➡️ Pan Right (우측 모션)', ffmpeg: `zoompan=z='if(lte(on,1),0,x+1.5)':y='ih/2-(ih/zoom/2)':d=120:s=${w}x${h}:fps=30` },
            { id: 'kenBurns', name: '🎬 Ken Burns (대각 모션)', ffmpeg: `zoompan=z='min(zoom+0.0018,1.25)':x='if(lte(on,1),0,x+1)':y='if(lte(on,1),0,y+1)':d=120:s=${w}x${h}:fps=30` },
            { id: 'rotateZoom', name: '🔄 Rotate & Zoom (부드러운 회전)', ffmpeg: `zoompan=z='min(zoom+0.0015,1.20)':d=120:s=${w}x${h}:fps=30` }
        ];

        const generateSampleImage = (title, color1, color2, icon) => {
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1920;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1920);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.beginPath();
            ctx.arc(540, 960, 320, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 120px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, 540, 880);

            ctx.font = 'bold 52px Paperlogy, sans-serif';
            ctx.fillText(title, 540, 1080);

            ctx.font = '36px Paperlogy, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillText('Subject & Product Auto Fusion', 540, 1160);

            return canvas.toDataURL('image/png');
        };

        const INITIAL_SAMPLE_IMAGES = [
            { title: '캐릭터 X 신상품 A', color1: '#4f46e5', color2: '#7c3aed', icon: '👤', prompt: '브랜드 신제품 패키지를 손에 쥐고 포즈를 취하는 매력적인 캐릭터' },
            { title: '프리미엄 제품 샷', color1: '#059669', color2: '#10b981', icon: '🛍️', prompt: '세련된 감성의 제품이 주인공으로 돋보이는 모던한 스튜디오 촬영 씬' },
            { title: '라이프스타일 컬라보', color1: '#d97706', color2: '#f59e0b', icon: '✨', prompt: '캐릭터와 제품이 조화롭게 어우러진 도심 속 화려한 숏폼 장면' },
            { title: '스마트 라이프스타일', color1: '#dc2626', color2: '#ef4444', icon: '📱', prompt: '미래지향적인 스마트 스페이스에서 제품을 시연하는 캐릭터' },
            { title: '뷰티 & 트렌드', color1: '#db2777', color2: '#ec4899', icon: '💄', prompt: '감각적인 조명 아래 화장품 제품과 함께 미소짓는 캐릭터' }
        ];

        const getDefaultSlides = () => INITIAL_SAMPLE_IMAGES.map((sample, idx) => ({
            id: 'slide_' + Date.now() + '_' + idx,
            url: generateSampleImage(sample.title, sample.color1, sample.color2, sample.icon),
            title: sample.title,
            effect: ['zoomIn', 'zoomOut', 'panLeft', 'kenBurns', 'rotateZoom'][idx % 5],
            duration: 4.0,
            narration: `장면 ${idx + 1} 나레이션 내용`,
            imagePrompt: sample.prompt || `장면 ${idx + 1}을 나타내는 감각적인 AI 이미지`
        }));

        const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        class WebAudioBGMGenerator {
            constructor() {
                this.audioCtx = null;
                this.destination = null;
                this.isPlaying = false;
                this.timer = null;
                this.volume = 0.4;
                this.mood = 'upbeat';
            }

            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                    this.destination = this.audioCtx.createMediaStreamDestination();
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            }

            setVolume(val) {
                this.volume = val;
            }

            setMood(mood) {
                this.mood = mood;
            }

            start() {
                this.init();
                this.isPlaying = true;
                let step = 0;

                const freqsMap = {
                    upbeat: [261.63, 329.63, 392.00, 523.25, 440.00, 349.23],
                    lofi: [220.00, 261.63, 329.63, 392.00, 349.23],
                    cinematic: [130.81, 164.81, 196.00, 261.63, 293.66],
                    corporate: [293.66, 369.99, 440.00, 587.33]
                };

                this.timer = setInterval(() => {
                    if (!this.isPlaying || !this.audioCtx) return;

                    const freqs = freqsMap[this.mood] || freqsMap.upbeat;
                    const freq = freqs[step % freqs.length];

                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    osc.type = this.mood === 'lofi' ? 'sine' : this.mood === 'cinematic' ? 'sawtooth' : 'triangle';
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.01, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.15 * this.volume, this.audioCtx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    gain.connect(this.destination);

                    osc.start();
                    osc.stop(this.audioCtx.currentTime + 0.45);

                    if (step % 2 === 0) {
                        const bassOsc = this.audioCtx.createOscillator();
                        const bassGain = this.audioCtx.createGain();
                        bassOsc.type = 'sine';
                        bassOsc.frequency.setValueAtTime(freq / 2, this.audioCtx.currentTime);

                        bassGain.gain.setValueAtTime(0.12 * this.volume, this.audioCtx.currentTime);
                        bassGain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.35);

                        bassOsc.connect(bassGain);
                        bassGain.connect(this.audioCtx.destination);
                        bassGain.connect(this.destination);

                        bassOsc.start();
                        bassOsc.stop(this.audioCtx.currentTime + 0.4);
                    }

                    step++;
                }, 300);
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }
        }

        const bgmEngine = new WebAudioBGMGenerator();

        function App() {
            // Theme state (Light / Dark mode)
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('app_theme');
                return savedTheme ? savedTheme === 'dark' : true;
            });

            useEffect(() => {
                const rootEl = document.documentElement;
                if (isDarkMode) {
                    rootEl.classList.add('dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    rootEl.classList.remove('dark');
                    localStorage.setItem('app_theme', 'light');
                }
            }, [isDarkMode]);

            const glassCardStyle = getGlassCardStyle(isDarkMode);

            const [selectedRatioKey, setSelectedRatioKey] = useState('9:16');
            const [hasMargin, setHasMargin] = useState(true);
            const currentRatio = ASPECT_RATIOS[selectedRatioKey];
            const motionEffects = getMotionEffects(currentRatio.width, currentRatio.height);

            const [slides, setSlides] = useState(getDefaultSlides);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [activeSlideIndex, setActiveSlideIndex] = useState(0);

            // BGM States
            const [bgmEnabled, setBgmEnabled] = useState(true);
            const [bgmMood, setBgmMood] = useState('upbeat');
            const [bgmVolume, setBgmVolume] = useState(0.5);
            const [isBgmPreviewing, setIsBgmPreviewing] = useState(false);

            // Script & AI TTS States
            const [scriptText, setScriptText] = useState(
                '[화면: 메인 캐릭터가 매력적인 포즈로 신상품을 강조한다] 안녕하세요! 오늘 단 하루 50% OFF 29,900원 한정특가 이벤트를 진행합니다.\n' +
                '[화면: 상품의 디테일한 포장과 디자인이 부각되는 선명한 클로즈업] 지금 안사면 평생 후회할 특가! 품절임박 전 서둘러 구매하세요.\n' +
                '[화면: 캐릭터와 상품이 함께 등장하는 감각적인 라이프스타일 씬] 트렌디한 인스타그램 릴스와 숏폼으로 특별한 제품 경험을 만나보세요.'
            );
            const [isAnalyzingScript, setIsAnalyzingScript] = useState(false);
            const [ttsVoice, setTtsVoice] = useState('Kore');

            // AI Character & Product Reference Image States
            const [characterRef, setCharacterRef] = useState(null);
            const [productRef, setProductRef] = useState(null);

            // Drag & Drop Highlight States for reference cards
            const [isDraggingChar, setIsDraggingChar] = useState(false);
            const [isDraggingProd, setIsDraggingProd] = useState(false);
            const [isDraggingBatch, setIsDraggingBatch] = useState(false);

            // AI Image Generation Loading Tracker
            const [generatingSlideIds, setGeneratingSlideIds] = useState({});
            const [isBatchGenerating, setIsBatchGenerating] = useState(false);

            // Top Text Layer States
            const [textEnabled, setTextEnabled] = useState(true);
            const [textLines, setTextLines] = useState([
                { id: 1, text: '지금 안사면 무조건 손해!', color: '#ffffff', size: 80, letterSpacing: 2 },
                { id: 2, text: '🔥 50% OFF 29,900원 (한정특가)', color: '#facc15', size: 48, letterSpacing: 2 }
            ]);
            const [textLineHeight, setTextLineHeight] = useState(1.2);
            const [textOffsetY, setTextOffsetY] = useState(0);

            // Gemini API Key States
            const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');

            // Export States
            const [isRendering, setIsRendering] = useState(false);
            const [renderProgress, setRenderProgress] = useState(0);
            const [renderedVideoUrl, setRenderedVideoUrl] = useState(null);
            const [showFFmpegModal, setShowFFmpegModal] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const canvasRef = useRef(null);
            const loadedImagesRef = useRef([]);
            const animationFrameRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const recordedChunksRef = useRef([]);

            // Slide durations
            const getSlideDuration = useCallback((slide) => slide.duration || 4, []);
            const TOTAL_DURATION = slides.reduce((acc, s) => acc + getSlideDuration(s), 0);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const processRefFile = (file, type) => {
                if (!file || !file.type.startsWith('image/')) {
                    showToast('⚠️ 이미지 파일만 업로드할 수 있습니다.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const result = e.target.result;
                    const base64Data = result.split(',')[1];
                    const refObj = {
                        url: result,
                        base64: base64Data,
                        mimeType: file.type,
                        name: file.name
                    };

                    if (type === 'character') {
                        setCharacterRef(refObj);
                        showToast('👤 캐릭터 참조 이미지가 등록되었습니다!');
                    } else if (type === 'product') {
                        setProductRef(refObj);
                        showToast('🛍️ 상품(제품) 참조 이미지가 등록되었습니다!');
                    }
                };
                reader.readAsDataURL(file);
            };

            // Drag and Drop event handlers
            const handleDragOver = (e, setDragState) => {
                e.preventDefault();
                e.stopPropagation();
                if (setDragState) setDragState(true);
            };

            const handleDragLeave = (e, setDragState) => {
                e.preventDefault();
                e.stopPropagation();
                if (setDragState) setDragState(false);
            };

            const handleDropRef = (e, type, setDragState) => {
                e.preventDefault();
                e.stopPropagation();
                if (setDragState) setDragState(false);

                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    processRefFile(files[0], type);
                }
            };

            const handleDropBatch = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDraggingBatch(false);

                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleBatchUpload(files);
                }
            };

            const generateTextFromScript = useCallback((customScript) => {
                const targetScript = customScript || scriptText || '';
                const cleanFullText = targetScript.replace(/\[.*?\]/g, '').replace(/\s+/g, ' ').trim();
                
                let impulseText = "지금 안사면 무조건 손해!";
                if (/마감|오늘|단\s*하루|서두르|품절|한정|수량/i.test(cleanFullText)) {
                    impulseText = "오늘 마감! 안사면 큰 손해";
                } else if (/특가|최저가|할인|반값|대박|이벤트/i.test(cleanFullText)) {
                    impulseText = "역대급 특가! 안사면 손해";
                } else if (/신상|패션|뷰티|아이템|인기/i.test(cleanFullText)) {
                    impulseText = "품절 대란! 안사면 큰 손해";
                } else if (/스마트|제작|숏폼|기능|솔루션|서비스/i.test(cleanFullText)) {
                    impulseText = "단 하루 기회! 안사면 손해";
                } else if (cleanFullText.length > 0) {
                    impulseText = "지금 안사면 무조건 손해!";
                }

                if (impulseText.length > 15) {
                    impulseText = impulseText.substring(0, 15);
                } else if (impulseText.length < 12) {
                    impulseText = (impulseText + " 안사면 손해").substring(0, 14);
                }

                const dateMatch = targetScript.match(/(\d{1,2}월\s*\d{1,2}일(?:\s*한정)?|오늘\s*단\s*하루|오늘만|단\s*\d+일간)/i);
                const discountMatch = targetScript.match(/(\d+%\s*(?:OFF|할인|다운))/i);
                const priceMatch = targetScript.match(/([\d,]+\s*(?:원|천원))/i);
                const specialMatch = targetScript.match(/(한정특가|초특가|역대급\s*특가|파격\s*특가|단독\s*특가)/i);

                let priceParts = [];
                if (dateMatch) priceParts.push(dateMatch[0].trim());
                if (specialMatch && !dateMatch) priceParts.push(specialMatch[0].trim());
                if (discountMatch) priceParts.push(discountMatch[0].trim());
                if (priceMatch) priceParts.push(priceMatch[0].trim());

                let priceText = "";
                if (priceParts.length > 0) {
                    priceText = `🔥 ${priceParts.join(' ')}`;
                } else {
                    const fullPriceMatch = targetScript.match(/(\d+%\s*OFF\s*[\d,]*원?|[\d,]*원\s*\(\d+%\s*OFF\)|[\d,]*원|\d+%\s*OFF|한정특가\s*[\d,]*원?|\d+%\s*할인)/i);
                    priceText = fullPriceMatch ? `🔥 ${fullPriceMatch[0]}` : '🔥 50% OFF 29,900원 (한정특가)';
                }

                return [
                    { id: 1, text: impulseText, color: '#ffffff', size: 80, letterSpacing: 2 },
                    { id: 2, text: priceText, color: '#facc15', size: 48, letterSpacing: 2 }
                ];
            }, [scriptText]);

            const handleAnalyzeTextLines = () => {
                const newLines = generateTextFromScript();
                setTextLines(newLines);
                showToast('✍️ 대본 분석 기반 [충동구매 유도 문구(80pt) & 가격할인] 텍스트가 생성되었습니다!');
            };

            const handleResetAll = () => {
                setIsPlaying(false);
                setCurrentTime(0);
                setSlides(getDefaultSlides());
                setCharacterRef(null);
                setProductRef(null);
                setRenderedVideoUrl(null);
                showToast('🔄 모든 설정, 캐릭터, 상품 및 이미지가 초기화되었습니다.');
            };

            const toggleBgmPreview = () => {
                if (isBgmPreviewing) {
                    bgmEngine.stop();
                    setIsBgmPreviewing(false);
                } else {
                    bgmEngine.setMood(bgmMood);
                    bgmEngine.setVolume(bgmVolume);
                    bgmEngine.start();
                    setIsBgmPreviewing(true);
                }
            };

            useEffect(() => {
                let isMounted = true;
                const loadPromises = slides.map(slide => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(img);
                        img.src = slide.url;
                    });
                });

                Promise.all(loadPromises).then(images => {
                    if (isMounted) {
                        loadedImagesRef.current = images;
                        drawCanvasFrame(currentTime);
                    }
                });

                return () => { isMounted = false; };
            }, [slides, selectedRatioKey, hasMargin, textEnabled, textLines, textLineHeight, textOffsetY]);

            const drawCanvasFrame = useCallback((timeSec) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const images = loadedImagesRef.current;

                const w = currentRatio.width;
                const h = currentRatio.height;

                canvas.width = w;
                canvas.height = h;

                // Clear Background
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, w, h);

                if (images.length === 0) return;

                let accumulatedTime = 0;
                let activeIdx = 0;
                let slideTimeSec = 0;

                for (let i = 0; i < slides.length; i++) {
                    const dur = getSlideDuration(slides[i]);
                    if (timeSec >= accumulatedTime && timeSec < accumulatedTime + dur) {
                        activeIdx = i;
                        slideTimeSec = timeSec - accumulatedTime;
                        break;
                    }
                    accumulatedTime += dur;
                    if (i === slides.length - 1) {
                        activeIdx = slides.length - 1;
                        slideTimeSec = dur;
                    }
                }

                setActiveSlideIndex(activeIdx);

                const currentSlide = slides[activeIdx];
                const currentImg = images[activeIdx];
                const currentDur = getSlideDuration(currentSlide);

                // Margin logic for 9:16
                const topMarginRatio = (selectedRatioKey === '9:16' && hasMargin) ? 0.2 : 0.0;
                const topMarginPx = Math.round(h * topMarginRatio);
                const viewportH = h - topMarginPx;

                if (topMarginRatio > 0) {
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, w, topMarginPx);
                }

                // Render Image Motion inside Viewport
                if (currentImg && currentImg.complete) {
                    const progress = Math.min(1.0, Math.max(0, slideTimeSec / currentDur));
                    const easedP = easeInOutCubic(progress);

                    let scale = 1.0;
                    let offsetX = 0;
                    let offsetY = 0;

                    if (currentSlide.effect === 'zoomIn') scale = 1.0 + easedP * 0.2;
                    else if (currentSlide.effect === 'zoomOut') scale = 1.2 - easedP * 0.2;
                    else if (currentSlide.effect === 'panLeft') { scale = 1.15; offsetX = (0.5 - easedP) * (w * 0.1); }
                    else if (currentSlide.effect === 'panRight') { scale = 1.15; offsetX = (easedP - 0.5) * (w * 0.1); }
                    else if (currentSlide.effect === 'kenBurns') { scale = 1.05 + easedP * 0.15; offsetX = (easedP - 0.5) * (w * 0.05); offsetY = (easedP - 0.5) * (viewportH * 0.05); }
                    else if (currentSlide.effect === 'rotateZoom') { scale = 1.05 + easedP * 0.12; }

                    ctx.save();
                    ctx.filter = 'none';
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    ctx.beginPath();
                    ctx.rect(0, topMarginPx, w, viewportH);
                    ctx.clip();

                    ctx.translate(w / 2 + offsetX, topMarginPx + viewportH / 2 + offsetY);
                    ctx.scale(scale, scale);

                    const imgRatio = currentImg.width / currentImg.height;
                    const vpRatio = w / viewportH;
                    let drawW, drawH;

                    if (imgRatio > vpRatio) {
                        drawH = viewportH;
                        drawW = viewportH * imgRatio;
                    } else {
                        drawW = w;
                        drawH = w / imgRatio;
                    }

                    ctx.drawImage(currentImg, -drawW / 2, -drawH / 2, drawW, drawH);
                    ctx.restore();
                }

                // Render Top Text Layer if enabled
                if (textEnabled && textLines.length > 0) {
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    let totalTextHeight = 0;
                    textLines.forEach(l => { totalTextHeight += (l.size || 50) * textLineHeight; });

                    let startY = (topMarginRatio > 0 
                        ? (topMarginPx / 2) - (totalTextHeight / 2) + ((textLines[0]?.size || 50) / 2)
                        : (h * 0.1) - (totalTextHeight / 2)) + textOffsetY;

                    textLines.forEach((lineObj) => {
                        if (!lineObj.text) return;
                        ctx.font = `bold ${lineObj.size || 50}px 'Paperlogy', sans-serif`;
                        ctx.fillStyle = lineObj.color || '#ffffff';

                        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                        ctx.lineWidth = Math.max(3, (lineObj.size || 50) * 0.08);

                        const txt = lineObj.text;
                        ctx.strokeText(txt, w / 2, startY);
                        ctx.fillText(txt, w / 2, startY);

                        startY += (lineObj.size || 50) * textLineHeight;
                    });

                    ctx.restore();
                }

            }, [slides, currentRatio, hasMargin, selectedRatioKey, textEnabled, textLines, textLineHeight, textOffsetY, getSlideDuration]);

            useEffect(() => {
                let lastTimestamp = null;
                const step = (timestamp) => {
                    if (!lastTimestamp) lastTimestamp = timestamp;
                    const delta = (timestamp - lastTimestamp) / 1000;
                    lastTimestamp = timestamp;

                    if (isPlaying) {
                        setCurrentTime((prev) => {
                            const next = prev + delta;
                            if (next >= TOTAL_DURATION) {
                                setIsPlaying(false);
                                return 0;
                            }
                            return next;
                        });
                    }
                    animationFrameRef.current = requestAnimationFrame(step);
                };

                if (isPlaying) {
                    animationFrameRef.current = requestAnimationFrame(step);
                }

                return () => {
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                };
            }, [isPlaying, TOTAL_DURATION]);

            useEffect(() => {
                drawCanvasFrame(currentTime);
            }, [currentTime, drawCanvasFrame]);

            const handleAnalyzeScript = async () => {
                if (!scriptText.trim()) {
                    showToast('⚠️ 분석할 대본 문장을 입력해주세요.');
                    return;
                }

                setIsAnalyzingScript(true);
                showToast('🤖 대본의 [화면] 텍스트를 추출하여 20초 분량 프롬프트를 생성 중입니다...');

                setTimeout(() => {
                    const lines = scriptText.split('\n').filter(l => l.trim().length > 0);
                    const extractedVisuals = [];

                    lines.forEach((line) => {
                        const visualMatch = line.match(/\[?화면\s*:\s*([^\]\n]+)\]?/i);
                        if (visualMatch) {
                            extractedVisuals.push({
                                visual: visualMatch[1].trim(),
                                fullLine: line.replace(/\[?화면\s*:\s*([^\]\n]+)\]?/gi, '').trim() || visualMatch[1].trim()
                            });
                        }
                    });

                    if (extractedVisuals.length === 0) {
                        lines.forEach((line) => {
                            const cleanText = line.replace(/\[.*?\]/g, '').trim();
                            if (cleanText) {
                                extractedVisuals.push({
                                    visual: `${cleanText} 비주얼 씬`,
                                    fullLine: cleanText
                                });
                            }
                        });
                    }

                    const totalVisuals = extractedVisuals.length || 1;
                    const perSlideDuration = parseFloat((20.0 / totalVisuals).toFixed(1));

                    const processedSlides = extractedVisuals.map((item, idx) => ({
                        id: 'slide_' + Date.now() + '_' + idx,
                        url: slides[idx]?.url || generateSampleImage(`장면 ${idx + 1}`, '#4f46e5', '#7c3aed', '✨'),
                        title: `장면 ${idx + 1}`,
                        effect: ['zoomIn', 'zoomOut', 'panLeft', 'panRight', 'kenBurns', 'rotateZoom'][idx % 6],
                        duration: perSlideDuration,
                        narration: item.fullLine,
                        imagePrompt: item.visual
                    }));

                    if (processedSlides.length > 0) {
                        setSlides(processedSlides);
                    }

                    setTextLines(generateTextFromScript(scriptText));

                    setIsAnalyzingScript(false);
                    showToast(`🎉 총 20초 분량 (${processedSlides.length}개 장면, 각 ${perSlideDuration}초) 대본 및 텍스트 레이어 추출 완료!`);
                }, 800);
            };

            const generateAIImageForSlide = async (slideIndex, targetSlidesList = slides) => {
                const slide = targetSlidesList[slideIndex];
                if (!slide) return;

                const slideId = slide.id;
                setGeneratingSlideIds(prev => ({ ...prev, [slideId]: true }));

                const promptText = slide.imagePrompt || slide.narration || slide.title || "trendy high quality video scene";
                const apiKey = geminiApiKey || ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=${apiKey}`;

                let parts = [];
                let instructions = [];

                if (characterRef) {
                    instructions.push("Maintain the facial features, hairstyle, clothing style, and identity of the person shown in the CHARACTER reference image.");
                }

                if (productRef) {
                    instructions.push("Accurately feature and display the product design, shape, branding, and details as shown in the PRODUCT reference image.");
                }

                let fullPrompt = "";
                if (instructions.length > 0) {
                    fullPrompt = `[Multi-Reference Image Generation] Instructions: ${instructions.join(" ")} Scene description: ${promptText}. Create a cohesive, high-quality, professional image combining these elements.`;
                } else {
                    fullPrompt = `Scene description: ${promptText}. High quality, cinematic lighting, 8k resolution.`;
                }

                parts.push({ text: fullPrompt });

                // Attach reference images
                if (characterRef) {
                    parts.push({
                        inlineData: {
                            mimeType: characterRef.mimeType,
                            data: characterRef.base64
                        }
                    });
                }

                if (productRef) {
                    parts.push({
                        inlineData: {
                            mimeType: productRef.mimeType,
                            data: productRef.base64
                        }
                    });
                }

                const payload = {
                    contents: [{
                        role: "user",
                        parts: parts
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: selectedRatioKey === '9:16' ? "9:16" : selectedRatioKey === '16:9' ? "16:9" : "1:1" }
                    }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                    if (part && part.inlineData) {
                        const newImgUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                        setSlides(prev => prev.map((s, idx) => idx === slideIndex ? { ...s, url: newImgUrl } : s));
                        showToast(`✨ 장면 ${slideIndex + 1} AI 이미지가 생성되었습니다!`);
                    } else {
                        throw new Error("API 응답에서 이미지 데이터를 찾을 수 없습니다.");
                    }
                } catch (err) {
                    console.error("Image Generation Error:", err);
                    showToast(`❌ 장면 ${slideIndex + 1} AI 이미지 생성 실패. API 키나 네트워크 설정을 확인하세요.`);
                } finally {
                    setGeneratingSlideIds(prev => ({ ...prev, [slideId]: false }));
                }
            };

            const handleBatchGenerateImages = async () => {
                if (isBatchGenerating) return;
                setIsBatchGenerating(true);
                showToast(`⚡ 전체 ${slides.length}개 장면 AI 이미지 순차 일괄 생성 시작...`);

                for (let i = 0; i < slides.length; i++) {
                    await generateAIImageForSlide(i);
                }

                setIsBatchGenerating(false);
                showToast('🎉 전체 장면 AI 이미지 일괄 생성이 완료되었습니다!');
            };

            const handleBatchUpload = (files) => {
                if (!files || files.length === 0) return;
                const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
                
                if (validFiles.length === 0) {
                    showToast('⚠️ 이미지 파일만 업로드할 수 있습니다.');
                    return;
                }

                const newSlides = validFiles.map((file, idx) => ({
                    id: 'slide_' + Date.now() + '_' + idx,
                    url: URL.createObjectURL(file),
                    title: file.name,
                    effect: ['zoomIn', 'zoomOut', 'panLeft', 'panRight', 'kenBurns', 'rotateZoom'][idx % 6],
                    duration: 4.0,
                    narration: '',
                    imagePrompt: file.name
                }));

                setSlides(newSlides);
                setCurrentTime(0);
                showToast(`🎉 ${newSlides.length}장의 이미지가 연속 업로드되었습니다.`);
            };

            const handleSingleFileUpload = (idx, file) => {
                if (!file || !file.type.startsWith('image/')) return;
                const updated = [...slides];
                updated[idx] = {
                    ...updated[idx],
                    url: URL.createObjectURL(file),
                    title: file.name
                };
                setSlides(updated);
                showToast(`✅ ${idx + 1}번 이미지가 업데이트되었습니다.`);
            };

            const handleExportMP4 = async () => {
                setIsPlaying(false);
                setCurrentTime(0);
                setIsRendering(true);
                setRenderProgress(0);

                const canvas = canvasRef.current;
                if (!canvas) return;

                if (bgmEnabled) {
                    bgmEngine.setMood(bgmMood);
                    bgmEngine.setVolume(bgmVolume);
                    bgmEngine.start();
                }

                const canvasStream = canvas.captureStream(30);
                let combinedStream = canvasStream;

                if (bgmEnabled && bgmEngine.destination) {
                    const audioTrack = bgmEngine.destination.stream.getAudioTracks()[0];
                    if (audioTrack) {
                        combinedStream = new MediaStream([
                            ...canvasStream.getVideoTracks(),
                            audioTrack
                        ]);
                    }
                }

                recordedChunksRef.current = [];

                let options = { mimeType: 'video/mp4;codecs=avc1,mp4a.40.2' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/mp4' };
                }
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm;codecs=vp9' };
                }

                try {
                    const recorder = new MediaRecorder(combinedStream, options);
                    mediaRecorderRef.current = recorder;

                    recorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            recordedChunksRef.current.push(e.data);
                        }
                    };

                    recorder.onstop = () => {
                        if (bgmEnabled) bgmEngine.stop();
                        const blob = new Blob(recordedChunksRef.current, { type: options.mimeType.includes('mp4') ? 'video/mp4' : 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        setRenderedVideoUrl(url);
                        setIsRendering(false);
                        showToast(`🎉 MP4 동영상이 성공적으로 생성되었습니다!`);
                    };

                    recorder.start(100);

                    const fps = 30;
                    const totalFrames = TOTAL_DURATION * fps;
                    let currentFrame = 0;

                    const renderInterval = setInterval(() => {
                        currentFrame++;
                        const frameTime = currentFrame / fps;
                        setCurrentTime(frameTime);
                        drawCanvasFrame(frameTime);
                        setRenderProgress(Math.min(100, Math.round((currentFrame / totalFrames) * 100)));

                        if (currentFrame >= totalFrames) {
                            clearInterval(renderInterval);
                            setTimeout(() => {
                                recorder.stop();
                            }, 300);
                        }
                    }, 1000 / fps);

                } catch (err) {
                    console.error("Export Error:", err);
                    if (bgmEnabled) bgmEngine.stop();
                    setIsRendering(false);
                    showToast('❌ 동영상 생성 중 오류가 발생했습니다.');
                }
            };

            const generateFFmpegCommand = () => {
                const w = currentRatio.width;
                const h = currentRatio.height;

                let cmd = `# [1단계] 각 장면별 음성 파일(sceneX.wav) 길이 확인 명령 (초 단위)\n`;
                slides.forEach((_, idx) => {
                    cmd += `ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 scene${idx + 1}.wav\n`;
                });

                cmd += `\n# [2단계] 이미지 + 음성 → 각 장면 개별 숏폼 클립(sceneX.mp4) 생성 (음성 길이만큼 인코딩)\n`;
                slides.forEach((slide, idx) => {
                    cmd += `ffmpeg -loop 1 -i scene${idx + 1}.jpg -i scene${idx + 1}.wav -c:v libx264 -tune stillimage -c:a aac -vf "scale=${w}:${h},format=yuv420p" -shortest scene${idx + 1}.mp4\n`;
                });

                cmd += `\n# [3단계] list.txt 파일 생성 및 합치기\n`;
                cmd += `ffmpeg -f concat -safe 0 -i list.txt -c copy final.mp4`;

                return cmd;
            };

            return (
                <div className="flex-1 flex flex-col max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
                    
                    {/* Header Controls */}
                    <header className={cx(glassCardStyle, "rounded-2xl p-5 sm:p-6 flex flex-col md:flex-row items-center justify-between gap-4 border-l-4 border-l-purple-500")}>
                        <div className="flex items-center space-x-4">
                            <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 via-pink-500 to-red-500 flex items-center justify-center text-2xl shadow-lg shadow-purple-500/30">
                                🎬
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2">
                                    FFmpeg & Emotion <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-red-400">Motion Generator</span>
                                </h1>
                                <p className="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">
                                    캐릭터 & 상품 참조 AI 합성, N장 모션, 상단 텍스트, BGM이 통합된 숏폼 MP4 제작
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2.5 w-full md:w-auto justify-end flex-wrap">
                            <button
                                onClick={() => {
                                    setIsDarkMode(!isDarkMode);
                                    showToast(isDarkMode ? '☀️ 라이트 모드로 전환되었습니다.' : '🌙 다크 모드로 전환되었습니다.');
                                }}
                                className="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-gray-200 text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5"
                                title="라이트/다크 모드 변경"
                            >
                                {isDarkMode ? '☀️ 라이트' : '🌙 다크'}
                            </button>

                            <button 
                                onClick={() => {
                                    setTempApiKey(geminiApiKey);
                                    setShowApiKeyModal(true);
                                }}
                                className="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-gray-200 text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 relative"
                                title="Gemini API Key 설정"
                            >
                                ⚙️ <span className="hidden sm:inline">API 키 설정</span>
                                {geminiApiKey && (
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                )}
                            </button>

                            <button 
                                onClick={handleResetAll}
                                className="px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-gray-200 text-xs sm:text-sm font-semibold border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5"
                            >
                                🔄 초기화
                            </button>

                            <button 
                                onClick={() => setShowFFmpegModal(true)}
                                className="px-3.5 py-2 rounded-xl bg-purple-100 dark:bg-purple-950/60 hover:bg-purple-200 dark:hover:bg-purple-900/80 text-purple-900 dark:text-purple-200 text-xs sm:text-sm font-semibold border border-purple-300 dark:border-purple-500/30 transition flex items-center gap-1.5"
                            >
                                💻 FFmpeg Script
                            </button>

                            <button 
                                onClick={handleExportMP4}
                                disabled={isRendering}
                                className={cx(gradientBtnStyle, "px-4 py-2 rounded-xl text-white text-xs sm:text-sm font-bold shadow-lg flex items-center gap-1.5 disabled:opacity-50")}
                            >
                                {isRendering ? '⏳ MP4 제작 중...' : '⚡ MP4 동영상 추출'}
                            </button>
                        </div>
                    </header>

                    {/* Aspect Ratio & Margin Controls */}
                    <div className={cx(glassCardStyle, "p-4 rounded-xl flex flex-wrap items-center justify-between gap-4 border border-slate-200 dark:border-slate-800")}>
                        <div className="flex items-center gap-2">
                            <span className="text-xs text-purple-600 dark:text-purple-300 font-bold uppercase tracking-wider">비율 선택:</span>
                            <div className="flex items-center gap-2 flex-wrap">
                                {Object.keys(ASPECT_RATIOS).map((key) => (
                                    <button
                                        key={key}
                                        onClick={() => {
                                            setSelectedRatioKey(key);
                                            showToast(`📐 화면 비율이 ${key} 로 변경되었습니다.`);
                                        }}
                                        className={cx(
                                            "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border",
                                            selectedRatioKey === key
                                                ? "bg-purple-600 text-white border-purple-400 shadow-md shadow-purple-500/30"
                                                : "bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-gray-400 border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800"
                                        )}
                                    >
                                        {ASPECT_RATIOS[key].label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {selectedRatioKey === '9:16' && (
                            <div className="flex items-center gap-2 bg-slate-200/80 dark:bg-slate-900/80 p-1 rounded-lg border border-purple-300 dark:border-purple-500/30">
                                <span className="text-[11px] text-gray-600 dark:text-gray-400 px-2 font-medium">9:16 여백 옵션:</span>
                                <button
                                    onClick={() => {
                                        setHasMargin(true);
                                        showToast('🔳 상단 여백 20%가 적용되었습니다.');
                                    }}
                                    className={cx(
                                        "px-2.5 py-1 rounded-md text-xs font-semibold transition",
                                        hasMargin ? "bg-purple-600 text-white" : "text-gray-600 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white"
                                    )}
                                >

                                            onChange={(e) => setTempApiKey(e.target.value)}
                                            placeholder="AIzaSy..."
                                            className="w-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white text-xs px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-purple-500 font-mono"
                                        />
                                    </div>

                                    {geminiApiKey && (
                                        <div className="flex items-center gap-1.5 text-[11px] text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 p-2 rounded-lg border border-emerald-200 dark:border-emerald-500/20">
                                            <span>✅ API 키가 로컬에 저장되어 활성화되었습니다.</span>
                                        </div>
                                    )}
                                </div>

                                <div className="flex justify-between items-center pt-2 border-t border-slate-200 dark:border-slate-800">
                                    {geminiApiKey ? (
                                        <button 
                                            onClick={() => {
                                                localStorage.removeItem('gemini_api_key');
                                                setGeminiApiKey('');
                                                setTempApiKey('');
                                                showToast('🗑️ 저장된 API 키가 삭제되었습니다.');
                                                setShowApiKeyModal(false);
                                            }}
                                            className="px-3 py-1.5 rounded-lg bg-red-100 dark:bg-red-950/60 hover:bg-red-200 dark:hover:bg-red-900/80 text-red-700 dark:text-red-300 text-xs font-semibold border border-red-300 dark:border-red-500/30 transition"
                                        >
                                            키 삭제
                                        </button>
                                    ) : <div></div>}

                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => setShowApiKeyModal(false)}
                                            className="px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-gray-300 text-xs transition"
                                        >
                                            취소
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const trimmed = tempApiKey.trim();
                                                localStorage.setItem('gemini_api_key', trimmed);
                                                setGeminiApiKey(trimmed);
                                                showToast('🔑 API 키가 로컬 PC에 성공적으로 저장되었습니다!');
                                                setShowApiKeyModal(false);
                                            }}
                                            className="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold transition"
                                        >
                                            저장하기
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isRendering && (
                        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-4">
                            <div className={cx(glassCardStyle, "max-w-md w-full rounded-2xl p-6 text-center space-y-4 border border-purple-500/40")}>
                                <div className="w-16 h-16 rounded-2xl bg-purple-600/30 text-purple-400 mx-auto flex items-center justify-center text-3xl animate-bounce">
                                    ⚙️
                                </div>
                                <h3 className="text-lg font-bold">MP4 동영상 렌더링 중</h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400">
                                    {slides.length}장의 원본 이미지 모션 및 배경음악 오디오를 인코딩하고 있습니다...
                                </p>

                                <div className="space-y-1">
                                    <div className="w-full h-3 bg-slate-200 dark:bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-300 dark:border-slate-800">
                                        <div 
                                            className="h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full transition-all duration-150"
                                            style={{ width: `${renderProgress}%` }}
                                        />
                                    </div>
                                    <div className="flex justify-between text-xs font-mono text-gray-500 dark:text-gray-400">
                                        <span>{renderProgress}%</span>
                                        <span>{((renderProgress / 100) * TOTAL_DURATION).toFixed(1)}s / {TOTAL_DURATION}.0s</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 dark:bg-slate-900 border border-purple-500 text-purple-200 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold animate-fade-in flex items-center gap-2">
                            <span>{toastMessage}</span>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
