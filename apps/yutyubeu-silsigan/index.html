<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 실시간 떡상 & 검색 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .video-card:hover { transform: translateY(-4px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-red-600 flex items-center gap-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                YT Analyzer
            </h1>
            
            <div class="flex flex-1 max-w-2xl w-full gap-2">
                <input type="password" id="apiKey" placeholder="YouTube API Key를 입력하세요" 
                    class="flex-1 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none">
                <button onclick="saveApiKey()" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition">저장</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Controls -->
        <div class="flex flex-col lg:flex-row gap-4 mb-8 items-end">
            <!-- Search Input -->
            <div class="flex-1 w-full">
                <label class="block text-sm font-semibold text-gray-700 mb-1">동영상 검색</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="검색어를 입력하세요" 
                        class="w-full border rounded-lg pl-4 pr-12 py-3 focus:ring-2 focus:ring-red-500 outline-none shadow-sm">
                    <button onclick="handleSearch()" class="absolute right-2 top-2 bg-red-600 text-white p-2 rounded-md hover:bg-red-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Filter: Period -->
            <div class="w-full md:w-1/2 lg:w-40">
                <label class="block text-sm font-semibold text-gray-700 mb-1">검색 기간</label>
                <select id="timePeriod" class="w-full border rounded-lg px-4 py-3 outline-none shadow-sm cursor-pointer">
                    <option value="all">전체</option>
                    <option value="day">오늘 (24시간)</option>
                    <option value="week">이번 주</option>
                    <option value="month">이번 달</option>
                    <option value="year">올해</option>
                </select>
            </div>

            <!-- Filter: Sort -->
            <div class="w-full md:w-1/2 lg:w-40">
                <label class="block text-sm font-semibold text-gray-700 mb-1">정렬 기준</label>
                <select id="sortOrder" onchange="renderVideos()" class="w-full border rounded-lg px-4 py-3 outline-none shadow-sm cursor-pointer">
                    <option value="relevance">정확도순</option>
                    <option value="viewCount">조회수 높은순</option>
                    <option value="date">최신순</option>
                </select>
            </div>

            <button onclick="fetchTrending()" class="w-full lg:w-auto bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold shadow-md whitespace-nowrap transition">
                실시간 떡상 확인
            </button>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-lg animate-pulse"></div>

        <!-- Video Grid -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full py-20 text-center text-gray-400">
                <p class="text-xl">API Key를 입력하고 검색어나 인기 동영상을 불러오세요.</p>
            </div>
        </div>
    </main>

    <script>
        let currentVideos = [];
        let API_KEY = localStorage.getItem('yt_api_key') || '';
        
        if (API_KEY) {
            document.getElementById('apiKey').value = API_KEY;
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                API_KEY = key;
                localStorage.setItem('yt_api_key', key);
                showMessage('API Key가 성공적으로 저장되었습니다.', 'success');
            } else {
                showMessage('유효한 API Key를 입력해주세요.', 'error');
            }
        }

        function showMessage(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `mb-6 p-4 rounded-lg transition-all duration-300 ${type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.remove('animate-pulse'), 2000);
        }

        // 기간에 따른 PublishedAfter RFC 3339 시간 생성 함수
        function getPublishedAfter(period) {
            if (period === 'all') return null;
            
            const now = new Date();
            let date;
            
            switch(period) {
                case 'day':
                    date = new Date(now.getTime() - (24 * 60 * 60 * 1000));
                    break;
                case 'week':
                    date = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
                    break;
                case 'month':
                    date = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
                    break;
                case 'year':
                    date = new Date(now.getTime() - (365 * 24 * 60 * 60 * 1000));
                    break;
                default:
                    return null;
            }
            return date.toISOString(); // 'YYYY-MM-DDTHH:mm:ssZ'
        }

        async function fetchTrending() {
            if (!checkApiKey()) return;
            
            try {
                // 인기 동영상은 '지역 내 실시간'이므로 기간 필터는 적용하지 않습니다.
                const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=KR&maxResults=24&key=${API_KEY}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                currentVideos = data.items.map(item => ({
                    id: item.id,
                    title: item.snippet.title,
                    channel: item.snippet.channelTitle,
                    thumbnail: item.snippet.thumbnails.high.url,
                    views: parseInt(item.statistics.viewCount),
                    publishedAt: item.snippet.publishedAt
                }));
                
                renderVideos();
                showMessage('한국 지역 실시간 인기 동영상을 불러왔습니다.', 'success');
            } catch (error) {
                showMessage(`오류 발생: ${error.message}`, 'error');
            }
        }

        async function handleSearch() {
            if (!checkApiKey()) return;
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return showMessage('검색어를 입력해주세요.', 'error');
            
            const sort = document.getElementById('sortOrder').value;
            const period = document.getElementById('timePeriod').value;
            const publishedAfter = getPublishedAfter(period);

            try {
                // 1. 검색 API 호출
                let searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=24&order=${sort}&key=${API_KEY}`;
                
                if (publishedAfter) {
                    searchUrl += `&publishedAfter=${publishedAfter}`;
                }

                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();
                
                if (searchData.error) throw new Error(searchData.error.message);
                if (searchData.items.length === 0) {
                    currentVideos = [];
                    renderVideos();
                    return showMessage('해당 기간 내 검색 결과가 없습니다.', 'error');
                }
                
                const videoIds = searchData.items.map(item => item.id.videoId).join(',');

                // 2. 상세 조회수 데이터 가져오기
                const statsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoIds}&key=${API_KEY}`);
                const statsData = await statsRes.json();

                currentVideos = statsData.items.map(item => ({
                    id: item.id,
                    title: item.snippet.title,
                    channel: item.snippet.channelTitle,
                    thumbnail: item.snippet.thumbnails.high.url,
                    views: parseInt(item.statistics.viewCount) || 0,
                    publishedAt: item.snippet.publishedAt
                }));

                // 조회수순 정렬 요청 시 클라이언트 사이드에서 재정렬 (API 결과 보정)
                if (sort === 'viewCount') {
                    currentVideos.sort((a, b) => b.views - a.views);
                }

                renderVideos();
                showMessage(`'${query}' 검색 결과 (${period === 'all' ? '전체' : period + ' 이내'})를 불러왔습니다.`, 'success');
            } catch (error) {
                showMessage(`오류 발생: ${error.message}`, 'error');
            }
        }

        function checkApiKey() {
            if (!API_KEY) {
                showMessage('상단에서 YouTube API Key를 먼저 저장해주세요.', 'error');
                return false;
            }
            return true;
        }

        function formatViews(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + '백만회';
            if (num >= 10000) return (num / 10000).toFixed(1) + '만회';
            if (num >= 1000) return (num / 1000).toFixed(1) + '천회';
            return num + '회';
        }

        function renderVideos() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (currentVideos.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-gray-500">데이터가 없습니다.</div>';
                return;
            }

            currentVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-sm video-card cursor-pointer border border-gray-100 flex flex-col';
                card.onclick = () => window.open(`https://www.youtube.com/watch?v=${video.id}`, '_blank');
                
                card.innerHTML = `
                    <div class="relative aspect-video">
                        <img src="${video.thumbnail}" class="w-full h-full object-cover" alt="${video.title}" onerror="this.src='https://via.placeholder.com/480x270?text=No+Image'">
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-gray-900 line-clamp-2 mb-2 leading-snug" title="${video.title}">${video.title}</h3>
                            <p class="text-sm text-gray-600 mb-2">${video.channel}</p>
                        </div>
                        <div class="flex justify-between items-center text-xs text-gray-500 mt-2">
                            <span class="font-bold text-red-600">조회수 ${formatViews(video.views)}</span>
                            <span>${new Date(video.publishedAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
